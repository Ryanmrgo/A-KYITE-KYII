name: Deploy Backend to AWS

on:
  push:
    branches:
      - main
    # THE MONOREPO TWEAK: Only run this robot if files inside the backend folder change!
    paths:
      - 'backend/**' 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            APP_DIR="$HOME/movie-streamer"

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            cd backend
            sudo docker build -t movie-backend:latest .
            
            # Stop the old backend (if it exists)
            sudo docker stop movie-backend-live || true
            sudo docker rm movie-backend-live || true
            
            # Run the new backend with the secret key!
            sudo docker run -d --restart unless-stopped --name movie-backend-live -p 80:5000 -e TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} movie-backend:latest

            for attempt in {1..12}; do
              if curl --fail --silent http://localhost/health > /dev/null; then
                exit 0
              fi
              sleep 5
            done

            echo "Backend health check failed"
            sudo docker logs movie-backend-live
            exit 1
