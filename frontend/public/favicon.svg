<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3344" />
      <stop offset="45%" stop-color="#e50914" />
      <stop offset="100%" stop-color="#8a0008" />
    </linearGradient>
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="52%" r="55%">
      <stop offset="0%" stop-color="#e50914" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#e50914" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#e50914" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Squircle Base with Rim -->
  <rect width="128" height="128" rx="30" fill="url(#bgGrad)" />
  <rect width="126" height="126" x="1" y="1" rx="29" fill="none" stroke="url(#rimLight)" stroke-width="1.5" />
  
  <!-- Subtle Cinematic Core Glow -->
  <circle cx="64" cy="66" r="46" fill="url(#glow)" />

  <!-- A-Kyite-Kyi "A" + Play Cinema Emblem -->
  <g filter="url(#shadow)">
    <!-- Left Stela -->
    <path d="M64 24 L28 100 L46 100 L64 56 Z" fill="url(#crimsonGrad)" />
    <!-- Right Stela with subtle shade for depth -->
    <path d="M64 24 L64 56 L82 100 L100 100 Z" fill="#b0050e" />
    <!-- Dynamic Forward Play Glyph in center -->
    <polygon points="56,54 78,67 56,80" fill="#ffffff" />
  </g>
</svg>
